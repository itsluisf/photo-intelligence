# Boot hardening (added 2026-06-13 after 2026-06-12 reboot incident).
# photo-intel.db lives on the frigate-4tb drive; without it the service
# crash-loops. RequiresMountsFor adds both Requires= and After= on the
# mount unit, so the service waits for the mount (incl. fsck) and never
# starts against an empty stub. See incident
# 2026-06-12-lmstudio-reboot-frigate4tb-unmount.
[Unit]
RequiresMountsFor=/your/media/drive
