# Boot hardening. photo-intel.db lives on the media drive; without it the
# service crash-loops. RequiresMountsFor adds both Requires= and After= on
# the mount unit, so the service waits for the mount (incl. fsck) and never
# starts against an empty stub. Edit the path to match your db_path volume.
[Unit]
RequiresMountsFor=/your/media/drive
